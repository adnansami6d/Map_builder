name: Build APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup templates and debug keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
              'export/android/android_sdk_path = "/usr/lib/android-sdk"' \
              'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' \
              'export/android/debug_keystore = "/root/debug.keystore"' \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' \
              'export/android/force_system_user = false' \
              'export/android/shutdown_adb_on_exit = true' > ~/.config/godot/$f
          done

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --export-debug "Android" build/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app.apk
